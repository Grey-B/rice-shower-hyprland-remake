# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#b4befe'

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[ ](fg:bold #cdd6f4)"
error_symbol = "[ ](fg:bold #c34162)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:#cdd6f4 fg:bold #393743"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](fg:#cdd6f4)[$symbol $branch(:$remote_branch)]($style)[ ](fg:#cdd6f4)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](fg:bold #c34162)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](#a2c591)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](#393743 fg:bold #cdd6f4)[](fg:bold #393743)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "fg:bold dimmed #a2c591"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "fg:bold #393743 #cdd6f4"
style_root = "#c34162 fg:bold"
format = "[](fg:bold #393743)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#79f7fd fg:bold #181825"
truncation_length = 2
truncation_symbol = ".../"
format = '[](fg:bold #79f7fd)[󰉋 → $path]($style)[](fg:bold #79f7fd)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](fg:bold #b4befe)[󰪢 $duration](bg:#b4befe fg:#313244)[](fg:bold #b4befe)'